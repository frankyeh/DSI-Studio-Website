<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 242" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Three tractography error modes</title>
<desc id="d">Three schematic panels on a voxel grid. Grey bands are an assumed ground-truth pathway, not something observed in a typical in-vivo scan. 1: a streamline drifts away from the pathway as small step errors accumulate. 2: one streamline stops early in a voxel without a reliable orientation and another continues past the cortex. 3: at a crossing, a streamline enters on bundle A and leaves on bundle B; every step follows a real local orientation, yet the connection is false.</desc>
