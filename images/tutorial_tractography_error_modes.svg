<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400">
<rect width="1100" height="400" fill="white"/>
<text x="550" y="38" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">Three common tractography error modes</text>
<rect x="30" y="75" width="320" height="260" rx="16" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
<text x="190" y="110" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Angular deviation</text>
<path d="M65 285 C125 245,175 205,305 145" fill="none" stroke="#16a34a" stroke-width="6"/>
<path d="M65 285 C125 248,185 230,305 190" fill="none" stroke="#dc2626" stroke-width="6" stroke-dasharray="10 8"/>
<text x="190" y="315" text-anchor="middle" font-family="Arial" font-size="17">small local errors accumulate</text>
<rect x="390" y="75" width="320" height="260" rx="16" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
<text x="550" y="110" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Termination error</text>
<path d="M430 250 C475 225,515 205,565 180" fill="none" stroke="#2563eb" stroke-width="7"/>
<rect x="575" y="135" width="80" height="125" rx="35" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
<path d="M565 180 C610 170,640 165,680 165" fill="none" stroke="#dc2626" stroke-width="6" stroke-dasharray="10 8"/>
<circle cx="570" cy="178" r="7" fill="#16a34a"/>
<text x="550" y="315" text-anchor="middle" font-family="Arial" font-size="17">stopping too early or too late</text>
<rect x="750" y="75" width="320" height="260" rx="16" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
<text x="910" y="110" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Pathway switching</text>
<path d="M785 270 C835 230,875 190,1025 145" fill="none" stroke="#2563eb" stroke-width="7"/>
<path d="M790 145 C855 175,910 215,1025 275" fill="none" stroke="#16a34a" stroke-width="7"/>
<path d="M785 270 C845 225,885 205,925 210 C955 214,990 245,1025 275" fill="none" stroke="#dc2626" stroke-width="6" stroke-dasharray="10 8"/>
<text x="910" y="315" text-anchor="middle" font-family="Arial" font-size="17">one bundle can be mistaken for another</text>
<text x="550" y="375" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700">Good local orientation estimates do not guarantee the correct full pathway.</text>
</svg>