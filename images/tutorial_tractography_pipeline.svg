<title id="t">Estimated local orientations versus an inferred streamline</title>
<desc id="d">Left: a grid of voxels, each holding a short line for the fiber orientation estimated from diffusion MRI; one voxel holds two crossing orientations. Right: the same estimates with a streamline started at a seed point and propagated step by step along them until it stops. The orientations are estimates and the streamline is an inference.</desc>
