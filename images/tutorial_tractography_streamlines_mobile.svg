<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 342 630" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Selective versus permissive tracking</title>
<desc id="d">Two schematic panels over the same assumed ground-truth anatomy: an arched bundle with a side branch and a lower straight bundle. Selective tracking: a few streamlines stay inside the bundles but the branch is missed, a false negative. Permissive tracking: more streamlines also recover the branch, but two streamlines cut between the bundles without anatomical support, false positives. Streamline density is illustrative only.</desc>
